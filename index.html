<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WebClip Master Ultimate</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a0a1a 100%);
    color: #fff; min-height: 100vh; padding: 14px;
    display: flex; flex-direction: column; align-items: center;
}
.container { max-width: 640px; width: 100%; }
h1 { text-align: center; font-size: 22px; margin-bottom: 6px; background: linear-gradient(135deg, #a855f7, #ec4899, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
.subtitle { text-align: center; font-size: 12px; color: #888; margin-bottom: 18px; line-height: 1.5; }
.card { background: rgba(255,255,255,0.03); border: 1px solid rgba(168,85,247,0.3); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.label { font-size: 11px; font-weight: 800; color: #a855f7; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
.label small { font-size: 10px; color: #888; font-weight: 600; text-transform: none; }
.field { margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 10px; font-weight: 700; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.field input, .field textarea, .field select { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(168,85,247,0.3); border-radius: 9px; color: #fff; padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; transition: 0.2s; }
.field textarea { resize: vertical; min-height: 100px; line-height: 1.6; font-family: 'Courier New', monospace; font-size: 12px; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: #a855f7; box-shadow: 0 0 15px rgba(168,85,247,0.3); }
.field textarea.desc-area { font-family: inherit; font-size: 13px; min-height: 80px; }

.web-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
.web-row input.name { flex: 0 0 70px; }
.web-row input.url { flex: 1; min-width: 0; }
.web-row select.type { flex: 0 0 60px; padding: 8px 4px; font-size: 11px; }
.web-row button { flex-shrink: 0; width: 34px; height: 34px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); border-radius: 8px; color: #ef4444; font-weight: 800; font-size: 16px; cursor: pointer; }
.add-btn { width: 100%; padding: 10px; background: rgba(34,197,94,0.15); border: 1px dashed rgba(34,197,94,0.5); border-radius: 9px; color: #22c55e; font-weight: 700; font-size: 12px; cursor: pointer; margin-top: 4px; }

.count-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
.count-btn { padding: 10px; background: rgba(0,0,0,0.3); border: 2px solid rgba(168,85,247,0.3); border-radius: 9px; color: #ccc; font-weight: 800; font-size: 13px; cursor: pointer; text-align: center; }
.count-btn.active { background: linear-gradient(135deg, #a855f7, #ec4899); border-color: transparent; color: #fff; }

.switch-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(0,0,0,0.3); border-radius: 9px; margin-top: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
.switch-label { font-size: 12px; font-weight: 600; color: #ddd; padding-right: 10px; }
.switch-label small { display: block; font-size: 10px; color: #888; margin-top: 2px; font-weight: 400; }
.switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .3s; border-radius: 34px; border: 1px solid rgba(255,255,255,0.1); }
.slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: #888; transition: .3s; border-radius: 50%; }
input:checked + .slider { background-color: rgba(34,197,94,0.3); border-color: rgba(34,197,94,0.6); }
input:checked + .slider:before { transform: translateX(20px); background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }

button.main-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #a855f7, #ec4899); border: none; border-radius: 12px; color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 8px; }
button.main-btn:disabled { opacity: 0.5; }
.download-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
button.install-btn, button.save-btn, button.userscript-btn { padding: 16px 8px; border: none; border-radius: 12px; color: #fff; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
button.install-btn { background: linear-gradient(135deg, #22c55e, #16a34a); }
button.save-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
button.userscript-btn { width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); margin-top: 8px; }
button small { font-size: 9px; opacity: 0.8; font-weight: 600; }

.status { font-size: 12px; text-align: center; padding: 12px; color: #22c55e; background: rgba(0,0,0,0.3); border-radius: 10px; margin-top: 12px; }
.status.error { color: #ef4444; }
.status.loading { color: #f59e0b; }
.hint, .notice-box { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.4); border-radius: 10px; padding: 12px; font-size: 11px; color: #93c5fd; line-height: 1.6; margin-bottom: 12px; }
.notice-box { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.4); color: #fbbf24; margin-top: 8px; }
.icon-preview-box { width: 64px; height: 64px; border-radius: 14px; background: rgba(0,0,0,0.4); border: 1px dashed rgba(168,85,247,0.4); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #666; margin-top: 6px; overflow: hidden; }
.icon-preview-box img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<div class="container">
    <h1>WEBCLIP MASTER ULTIMATE</h1>
    <div class="subtitle">Auto-parse US, Nhúng US, Ẩn URL, Icon Base64</div>

    <!-- 1. USERSCRIPT -->
    <div class="card" style="border-color: #f59e0b;">
        <div class="label" style="color: #f59e0b;">1. NHẬP USERSCRIPT</div>
        <div class="field">
            <label>Code .user.js (Dán toàn bộ code vào đây)</label>
            <textarea id="userscript-code" placeholder="// ==UserScript==&#10;// @name  My Script&#10;// @match https://ph4nt0m.lol/*&#10;// ==/UserScript=="></textarea>
        </div>
        <button class="add-btn" id="parse-us-btn" style="background: rgba(245,158,11,0.2); border-color: #f59e0b; color: #f59e0b;">⚡ TRÍCH XUẤT LINK TỪ US</button>
    </div>

    <!-- 2. CẤU HÌNH -->
    <div class="card">
        <div class="label">2. CẤU HÌNH CHUNG</div>
        <div class="field">
            <label>Tên app (hiện dưới icon)</label>
            <input type="text" id="app-name" placeholder="VD: MDUY iOS" value="MDUY iOS" maxlength="20">
        </div>
        <div class="field">
            <label>Link ảnh icon (https)</label>
            <input type="text" id="app-icon-url" placeholder="https://...">
            <div class="icon-preview-box" id="icon-preview">?</div>
        </div>
        <div class="field">
            <label>Hoặc chọn ảnh từ máy</label>
            <input type="file" id="icon-file" accept="image/*">
        </div>
        <div class="field">
            <label>Tiêu đề trang lưới</label>
            <input type="text" id="grid-title" placeholder="Chọn web hoặc app" value="Chọn web hoặc app">
        </div>
        
        <label class="switch-row" style="border-color: rgba(168,85,247,0.5);">
            <span class="switch-label" style="color: #a855f7;">
                <b>ẨN URL THẬT</b>
                <small>Giấu link web trong Cài đặt</small>
            </span>
            <label class="switch">
                <input type="checkbox" id="opt-hide-url" checked>
                <span class="slider"></span>
            </label>
        </label>
    </div>

    <!-- 3. SỐ LƯỢNG -->
    <div class="card">
        <div class="label">3. SỐ WEBCLIP CẦN TẠO <small id="count-display">1 icon</small></div>
        <div class="count-row">
            <button class="count-btn active" data-count="1">1</button>
            <button class="count-btn" data-count="2">2</button>
            <button class="count-btn" data-count="5">5</button>
            <button class="count-btn" data-count="10">10</button>
        </div>
    </div>

    <!-- 4. WEB/APP -->
    <div class="card">
        <div class="label">4. DANH SÁCH WEB / APP</div>
        <div id="web-list"></div>
        <button class="add-btn" id="add-web">+ Thêm mục</button>
    </div>

    <!-- 5. MÔ TẢ -->
    <div class="card">
        <div class="label">5. THÔNG TIN PROFILE</div>
        <div class="field">
            <label>Mô tả Profile (nhập dài tùy ý)</label>
            <textarea id="profile-desc" class="desc-area" placeholder="Nhập mô tả chi tiết...">WebClip tạo bởi MDUY
Tự động tích hợp UserScript.</textarea>
        </div>
    </div>

    <button class="main-btn" id="create-btn">TẠO CONFIG</button>
    <div class="status" id="status">Sẵn sàng</div>

    <div class="download-row" id="download-row" style="display:none;">
        <button class="install-btn" id="install-btn">CÀI NGAY<small>Mở cài đặt</small></button>
        <button class="save-btn" id="save-btn">LƯU TỆP<small>Tải .mobileconfig</small></button>
    </div>
    <button class="userscript-btn" id="userscript-btn" style="display:none;">TẢI USERSCRIPT (.user.js)<small>Dùng để cài vào Stay</small></button>
</div>

<script>
(function() {
    'use strict';
    var $ = function(id) { return document.getElementById(id); };
    var configFile = null, configBlobUrl = null, userScriptBlobUrl = null;
    var iconBase64 = null, currentCount = 1;

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16).toUpperCase();
        });
    }

    document.querySelectorAll('.count-btn').forEach(function(btn) {
        btn.onclick = function() {
            currentCount = parseInt(btn.getAttribute('data-count'));
            $('count-display').textContent = currentCount + ' icon';
            document.querySelectorAll('.count-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
        };
    });

    var previewEl = $('icon-preview');
    function fetchIconAsBase64(url) {
        return new Promise(function(resolve, reject) {
            if (!url) return resolve(null);
            fetch(url, { mode: 'cors' }).then(function(res) {
                if (!res.ok) throw new Error('Lỗi tải ảnh');
                return res.blob();
            }).then(function(blob) {
                if (blob.size > 1024 * 1024) throw new Error('Ảnh quá 1MB');
                var reader = new FileReader();
                reader.onload = function() {
                    var dataUrl = reader.result;
                    resolve({ base64: dataUrl.substring(dataUrl.indexOf(',') + 1), dataUrl: dataUrl });
                };
                reader.readAsDataURL(blob);
            }).catch(function() { reject(new Error('Lỗi CORS. Chọn ảnh từ máy.')); });
        });
    }

    $('app-icon-url').addEventListener('change', function() {
        var url = this.value.trim();
        if (!url) return;
        previewEl.innerHTML = '...';
        fetchIconAsBase64(url).then(function(r) {
            iconBase64 = r.base64;
            previewEl.innerHTML = '<img src="' + r.dataUrl + '">';
        }).catch(function() { previewEl.innerHTML = '!'; });
    });

    $('icon-file').addEventListener('change', function() {
        var file = this.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
            var dataUrl = reader.result;
            iconBase64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
            previewEl.innerHTML = '<img src="' + dataUrl + '">';
        };
        reader.readAsDataURL(file);
    });

    var webListEl = $('web-list');
    function addWebRow(name, url, type) {
        var row = document.createElement('div');
        row.className = 'web-row';
        row.innerHTML = '<input type="text" class="name" placeholder="Tên" value="' + (name||'') + '">' +
            '<input type="text" class="url" placeholder="https://..." value="' + (url||'') + '">' +
            '<select class="type"><option value="web"'+(type==='app'?'':' selected')+'>Web</option><option value="app"'+(type==='app'?' selected':'')+'>App</option></select>' +
            '<button type="button">×</button>';
        row.querySelector('button').onclick = function() { if(webListEl.children.length > 1) row.remove(); };
        webListEl.appendChild(row);
    }
    $('add-web').onclick = function() { addWebRow('', '', 'web'); };
    addWebRow('Web 1', 'https://ph4nt0m.lol', 'web');

    $('parse-us-btn').onclick = function() {
        var code = $('userscript-code').value;
        if (!code) {
            $('status').textContent = 'Vui lòng dán code UserScript trước!';
            $('status').className = 'status error';
            return;
        }

        var matchRegex = /@match\s+(https?:\/\/[^\s]+)/g;
        var matches = [];
        var m;
        while ((m = matchRegex.exec(code)) !== null) {
            var domain = m[1].replace(/\/\*$/, '').replace(/\/$/, '');
            if (matches.indexOf(domain) === -1) matches.push(domain);
        }

        if (matches.length === 0) {
            $('status').textContent = 'Không tìm thấy @match nào trong code!';
            $('status').className = 'status error';
            return;
        }

        webListEl.innerHTML = '';
        matches.forEach(function(link, index) {
            addWebRow('Web ' + (index + 1), link, 'web');
        });

        $('status').textContent = 'Đã tìm thấy ' + matches.length + ' link! Đã tự động điền.';
        $('status').className = 'status';
    };

    function buildLauncherHtml(items, title, usCode) {
        var itemsJson = JSON.stringify(items);
        var safeUsCode = usCode ? usCode.replace(/<\/script>/gi, '<\\/script>') : '';

        return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>'+title+'</title>' +
        '<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}body{font-family:-apple-system,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;padding:24px 16px;}' +
        'h1{font-size:24px;text-align:center;margin-bottom:28px;color:#a855f7;font-weight:900;}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px;max-width:600px;margin:0 auto;}' +
        '.tile{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px;position:relative;}' +
        '.tile:active{transform:scale(0.95);background:rgba(255,255,255,0.1);}.tile .icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;margin-bottom:10px;}' +
        '.tile.app .icon{background:linear-gradient(135deg,#22c55e,#16a34a);}.tile .name{font-size:12px;font-weight:700;color:#fff;word-break:break-word;line-height:1.3;}' +
        '.badge{position:absolute;top:6px;right:6px;background:#22c55e;color:#fff;font-size:8px;padding:2px 5px;border-radius:6px;font-weight:800;}</style></head><body>' +
        '<h1>'+title+'</h1><div class="grid" id="grid"></div><script>' +
        'var items = '+itemsJson+';\n' +
        'function nav(url, tab){var a=document.createElement("a");a.href=url;a.target=tab?"_blank":"_self";document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},100);}\n' +
        'items.forEach(function(w){var t=document.createElement("div");t.className="tile "+(w.type==="app"?"app":"");' +
        't.innerHTML=\'<div class="icon">\'+w.name.charAt(0).toUpperCase()+\'</div><div class="name">\'+w.name+\'</div>\'+(w.type==="app"?\'<div class="badge">APP</div>\':\'\');' +
        't.onclick=function(){nav(w.url, w.type==="app");};document.getElementById("grid").appendChild(t);});' +
        '<\/script>' +
        (usCode ? '<script>\n' + safeUsCode + '\n<\/script>' : '') +
        '</body></html>';
    }

    function buildPayload(name, url, base64, baseId, index, desc) {
        var uuid = generateUUID();
        var iconXml = base64 ? '            <key>Icon</key>\n            <data>'+base64+'</data>\n' : '';
        return [
            '        <dict>',
            '            <key>FullScreen</key>',
            '            <true/>',
            '            <key>IgnoreManifestScope</key>',
            '            <true/>',
            '            <key>IsRemovable</key>',
            '            <true/>',
            '            <key>Label</key>',
            '            <string>' + esc(name) + '</string>',
            '            <key>Precomposed</key>',
            '            <true/>',
            '            <key>PayloadDescription</key>',
            '            <string>' + esc(desc) + '</string>',
            '            <key>PayloadDisplayName</key>',
            '            <string>' + esc(name) + '</string>',
            '            <key>PayloadIdentifier</key>',
            '            <string>' + esc(baseId) + '.webclip.' + index + '.' + uuid + '</string>',
            '            <key>PayloadOrganization</key>',
            '            <string>MDUY</string>',
            '            <key>PayloadType</key>',
            '            <string>com.apple.webClip.managed</string>',
            '            <key>PayloadUUID</key>',
            '            <string>' + uuid + '</string>',
            '            <key>PayloadVersion</key>',
            '            <integer>1</integer>',
            '            <key>URL</key>',
            '            <string>' + esc(url) + '</string>',
            iconXml + '        </dict>'
        ].join('\n');
    }

    $('create-btn').onclick = function() {
        var btn = $('create-btn');
        btn.disabled = true;
        $('status').textContent = 'Đang xử lý...';
        $('status').className = 'status loading';

        var rows = webListEl.querySelectorAll('.web-row');
        var items = [];
        for (var i = 0; i < rows.length; i++) {
            var name = rows[i].querySelector('.name').value.trim() || 'App';
            var url = rows[i].querySelector('.url').value.trim();
            if (!/^https?:\/\//i.test(url) && !/^[a-z]+:\/\//i.test(url)) url = 'https://' + url;
            var type = rows[i].querySelector('.type').value;
            items.push({ name: name, url: url, type: type });
        }

        var appName = $('app-name').value.trim() || 'MDUY';
        var gridTitle = $('grid-title').value.trim() || 'Chọn để mở';
        var hideUrl = $('opt-hide-url').checked;
        var userScript = $('userscript-code').value.trim();
        var profileDesc = $('profile-desc').value.trim() || 'WebClip tạo bởi MDUY';

        var launcherHtml = buildLauncherHtml(items, gridTitle, userScript);
        var base64Html = btoa(unescape(encodeURIComponent(launcherHtml)));
        var finalUrl = 'data:text/html;charset=utf-8;base64,' + base64Html;

        if (!hideUrl && items.length === 1) finalUrl = items[0].url;

        var masterId = 'com.mduy.webclip.' + generateUUID().substring(0, 8);
        var payloads = [];
        
        for (var i = 0; i < currentCount; i++) {
            var displayName = currentCount > 1 ? (appName + ' ' + (i + 1)) : appName;
            payloads.push(buildPayload(displayName, finalUrl, iconBase64, masterId, i, profileDesc));
        }

        var config = '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>PayloadContent</key>\n    <array>\n' +
            payloads.join('\n') + '\n    </array>\n    <key>PayloadDescription</key>\n    <string>' + esc(profileDesc) + '</string>\n    <key>PayloadDisplayName</key>\n    <string>' + esc(appName) + '</string>\n    <key>PayloadIdentifier</key>\n    <string>' + masterId + '</string>\n    <key>PayloadOrganization</key>\n    <string>MDUY</string>\n    <key>PayloadType</key>\n    <string>Configuration</string>\n    <key>PayloadUUID</key>\n    <string>' + generateUUID() + '</string>\n    <key>PayloadVersion</key>\n    <integer>1</integer>\n</dict>\n</plist>';

        if (configBlobUrl) URL.revokeObjectURL(configBlobUrl);
        configBlobUrl = URL.createObjectURL(new Blob([config], { type: 'application/x-apple-aspen-config' }));
        configFile = { name: 'WebClip.mobileconfig', blobUrl: configBlobUrl };

        if (userScriptBlobUrl) URL.revokeObjectURL(userScriptBlobUrl);
        if (userScript) {
            userScriptBlobUrl = URL.createObjectURL(new Blob([userScript], { type: 'text/javascript' }));
            $('userscript-btn').style.display = 'flex';
        } else {
            $('userscript-btn').style.display = 'none';
        }

        $('download-row').style.display = 'grid';
        $('status').textContent = 'Tạo thành công!';
        $('status').className = 'status';
        btn.disabled = false;
    };

    $('install-btn').onclick = function() { if (configFile) window.location.href = configFile.blobUrl; };
    $('save-btn').onclick = function() { if (configFile) download(configFile.blobUrl, configFile.name); };
    $('userscript-btn').onclick = function() { if (userScriptBlobUrl) download(userScriptBlobUrl, 'script.user.js'); };

    function download(url, name) {
        var a = document.createElement('a'); a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    function esc(s) { 
        return String(s)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;')
            .replace(/\n/g, '&#10;');
    }
})();
</script>
</body>
</html>
